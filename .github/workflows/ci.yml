name: CI

on:
  push:
    branches: [main, 'fix/**']
  pull_request:

# El flujo solo necesita leer el código.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (Java 17, Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # Ejecuta las pruebas automáticas usando una base de datos en memoria (H2).
      - run: ./mvnw -B -ntp clean verify

  frontend:
    name: Frontend (Node, Vitest, Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      # Misma versión que en desarrollo: frontend/.nvmrc (engines: ver package.json).
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Falla si alguna dependencia tiene una vulnerabilidad alta o crítica conocida.
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build
