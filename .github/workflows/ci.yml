name: CI

on:
  push:
    branches: [main, 'fix/**']
  pull_request:

jobs:
  backend:
    name: Backend (Java 17, Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # Ejecuta las pruebas (H2 en memoria). Las pruebas de concurrencia/migración sobre MySQL se añadirán
      # cuando se defina el motor de base de datos definitivo.
      - run: ./mvnw -B -ntp clean verify

  frontend:
    name: Frontend (Node, Vitest, Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      # Misma versión que en desarrollo: frontend/.nvmrc (engines: ver package.json).
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
