version: '3.8'

services:
  # Base de Datos MySQL 8
  mysql:
    image: mysql:8.0
    container_name: nicolet_mysql
    restart: always
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password_123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-universidad_backend}
      MYSQL_USER: ${MYSQL_USER:-desarrollador}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-${DB_PASSWORD:-password_seguro_123}}
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - mysql_prod_data:/var/lib/mysql
    networks:
      - nicolet_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Backend Spring Boot 3
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SKIP_TESTS: "true"
    container_name: nicolet_backend
    restart: always
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: ${MYSQL_USER:-desarrollador}
      DB_PASSWORD: ${MYSQL_PASSWORD:-${DB_PASSWORD:-password_seguro_123}}
      JWT_SECRET: ${JWT_SECRET:-superSecretJwtKeyNicoletStudioFantasyAgendamiento2026Secure256Bit}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://52.87.43.82}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1,::1,172.16.0.0/12}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-nacuna888@gmail.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-admin@nicolet.cl}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-AdminNicolet2026!}
      APP_ADMIN_RESET_PASSWORD: ${APP_ADMIN_RESET_PASSWORD:-false}
      APP_DEMO_DATA_ENABLED: ${APP_DEMO_DATA_ENABLED:-false}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - nicolet_net

  # Frontend React (Nginx reverse-proxy)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nicolet_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - nicolet_net

volumes:
  mysql_prod_data:
    driver: local

networks:
  nicolet_net:
    driver: bridge
