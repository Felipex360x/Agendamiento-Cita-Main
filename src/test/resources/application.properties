# Base de datos H2 en memoria para pruebas (no necesita MySQL instalado)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Desactivar Swagger en pruebas
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Configuración JWT para pruebas
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration-ms=86400000
app.demo-data.enabled=true
# Contraseñas de las cuentas de ejemplo, solo para la base H2 en memoria de las pruebas.
