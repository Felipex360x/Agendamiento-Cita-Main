spring.application.name=backend
server.port=8080

# Base de datos MySQL
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/universidad_backend?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect


# Swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/doc/swagger-ui.html

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Datos de prueba desactivados por defecto; solo se cargan si se activa esta opción.
app.demo-data.enabled=${APP_DEMO_DATA_ENABLED:false}
# Contraseña de las cuentas de ejemplo. Si queda vacía se genera una al azar en cada arranque.
app.demo-data.password=${APP_DEMO_PASSWORD:}

# Primer administrador: se crea solo si la base no tiene ninguno. Sin APP_ADMIN_PASSWORD
# se genera una contraseña al azar y se muestra una única vez en la consola.
app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.password=${APP_ADMIN_PASSWORD:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# IPs de proxies seguros para leer X-Forwarded-For (separadas por coma).
app.security.trusted-proxies=${TRUSTED_PROXIES:127.0.0.1,::1}

# Correo electrónico (SMTP Gmail)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:nacuna888@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.frontend.base-url=${APP_FRONTEND_URL:http://localhost:5173}
management.health.mail.enabled=false
