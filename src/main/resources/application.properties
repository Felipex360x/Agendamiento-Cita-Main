spring.application.name=backend
server.port=8080

# Configuración de conexión a Base de Datos MySQL
# Compatible con ejecución local (localhost) y contenedores Docker (${DB_HOST:localhost})
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/universidad_backend?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:desarrollador}
spring.datasource.password=${DB_PASSWORD:password_seguro_123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de Hibernate JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Documentación interactiva OpenAPI / Swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/doc/swagger-ui.html

# Configuración JWT (JSON Web Token)
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration-ms=86400000